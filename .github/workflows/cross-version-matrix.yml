name: Lighting cross-version matrix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    name: sklearn-${{ matrix.sklearn }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sklearn: ['1.1.3', '1.2.2', '1.3.2', '1.4.2', '1.5.2', '1.6.1', '1.7.2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install controlled toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy==1.26.4" \
            "pandas==2.2.3" \
            "scipy==1.10.1" \
            "scikit-learn==${{ matrix.sklearn }}"
      - name: Run exact candidate matrix
        run: |
          python run_week_matrix.py --out "week_matrix_${{ matrix.sklearn }}.csv"
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: "matrix-${{ matrix.sklearn }}"
          path: "week_matrix_${{ matrix.sklearn }}.csv"
          if-no-files-found: error

  summarize:
    name: admission-summary
    runs-on: ubuntu-latest
    needs: matrix
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: matrix-*
          path: results
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Summarize admission geometry
        run: |
          python - <<'PY'
          import csv, glob, json
          rows=[]
          for p in sorted(glob.glob('results/*.csv')):
              with open(p,newline='',encoding='utf-8') as f:
                  rows.extend(csv.DictReader(f))
          gate=51.0
          iso=[float(r['wape_pct']) for r in rows if r['week_convention']=='ISO']
          wrong=[float(r['wape_pct']) for r in rows if r['week_convention'] in ('Sunday_%U','Monday_%W')]
          max_wrong=max(wrong)
          min_iso=min(iso)
          wrong_buffer=gate-max_wrong
          governed_buffer=min_iso-gate
          interval=min_iso-max_wrong
          passed=max_wrong < gate < min_iso
          print('ROWS')
          for r in rows:
              print(r)
          print('\nADMISSION')
          print(json.dumps({
              'gate_pct':gate,
              'max_wrong_pct':max_wrong,
              'min_governed_iso_pct':min_iso,
              'wrong_side_buffer_pp':wrong_buffer,
              'governed_side_buffer_pp':governed_buffer,
              'open_interval_pp':interval,
              'pass':passed,
          }, indent=2))
          if not passed:
              raise SystemExit('FAIL: cross-version admission inequality does not hold')
          PY
